<!DOCTYPE html>
<html lang="uz" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Vazifalarim - Zamonaviy To-Do</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-100 min-h-full flex items-center justify-center p-3 sm:p-6">

    <!-- Asosiy Konteyner -->
    <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl w-full max-w-xl p-5 sm:p-8 border border-white/20 transition-all duration-300">
        
        <!-- Sarlavha va Statistika -->
        <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 pb-4 border-b border-gray-100 gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> Vazifalarim
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Bugungi rejalaringizni tartibga soling</p>
            </div>
            <div class="flex items-center gap-3 bg-indigo-50/80 px-4 py-2.5 rounded-2xl border border-indigo-100 self-start sm:self-auto">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-semibold text-lg shadow-md shadow-indigo-200" id="task-progress-count">0/0</div>
                <div>
                    <div class="text-xs font-medium text-slate-500">Bajarildi</div>
                    <div class="text-sm font-bold text-slate-700" id="task-progress-text">0%</div>
                </div>
            </div>
        </header>

        <!-- Qidiruv paneli -->
        <div class="relative mb-4">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>
            <input 
                type="text" 
                id="search-input" 
                placeholder="Vazifalardan qidirish..." 
                class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-sm"
                autocomplete="off"
            >
        </div>

        <!-- Vazifa Qo'shish Formasi -->
        <form id="task-form" class="space-y-3 mb-6">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Yangi vazifa kiriting..." 
                    class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-sm sm:text-base"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-5 sm:px-6 py-3 rounded-2xl font-medium transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-sm sm:text-base cursor-pointer"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Qo'shish</span>
                </button>
            </div>
            
            <!-- Prioritet tanlash tugmalari -->
            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Muhimlik:</span>
                    <div class="flex gap-1.5" id="priority-selector">
                        <button type="button" data-priority="past" class="priority-btn px-2.5 py-1 text-xs font-medium rounded-lg bg-emerald-100 text-emerald-700 border border-emerald-200 transition-all hover:bg-emerald-200">Past</button>
                        <button type="button" data-priority="orta" class="priority-btn px-2.5 py-1 text-xs font-medium rounded-lg bg-amber-100 text-amber-700 border border-amber-200 ring-2 ring-amber-400 transition-all">O'rta</button>
                        <button type="button" data-priority="yuqori" class="priority-btn px-2.5 py-1 text-xs font-medium rounded-lg bg-rose-100 text-rose-700 border border-rose-200 transition-all hover:bg-rose-200">Yuqori</button>
                    </div>
                </div>
            </div>
        </form>

        <!-- Filtr va Tozalash qismi -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
            <!-- Filtr tugmalari -->
            <div class="flex bg-slate-100 p-1 rounded-2xl gap-1">
                <button data-filter="all" class="filter-btn flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-xl text-slate-800 bg-white shadow-sm transition-all">Barchasi</button>
                <button data-filter="active" class="filter-btn flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-xl text-slate-600 transition-all">Bajarilmagan</button>
                <button data-filter="completed" class="filter-btn flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-xl text-slate-600 transition-all">Bajarilgan</button>
            </div>

            <!-- Tozalash menyusi (Dropdown yoki Tugmalar) -->
            <div class="flex items-center gap-2">
                <button id="clear-completed-btn" title="Bajarilganlarni o'chirish" class="text-xs font-medium text-indigo-600 hover:text-indigo-800 transition-all px-3 py-2 flex items-center justify-center gap-1.5 rounded-xl hover:bg-indigo-50 border border-indigo-100 bg-indigo-50/50">
                    <i class="fa-solid fa-check-double"></i> Tugallanganlarni tozalash
                </button>
                <button id="clear-all-btn" title="Hammasini o'chirish" class="text-xs font-medium text-rose-500 hover:text-rose-700 transition-all px-3 py-2 flex items-center justify-center gap-1.5 rounded-xl hover:bg-rose-50 border border-rose-100 bg-rose-50/30">
                    <i class="fa-regular fa-trash-can"></i> Hammasi
                </button>
            </div>
        </div>

        <!-- Vazifalar ro'yxati -->
        <div class="space-y-3 max-h-[350px] overflow-y-auto pr-1" id="task-list">
            <!-- Dinamik ravishda vazifalar shu yerga qo'shiladi -->
        </div>

        <!-- Bo'sh holat (Vazifa yo'q bo'lganda) -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-10 text-center">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center text-2xl mb-3">
                <i class="fa-regular fa-face-smile"></i>
            </div>
            <p class="text-slate-600 font-medium text-sm sm:text-base" id="empty-text">Hozircha vazifalar mavjud emas</p>
            <p class="text-slate-400 text-xs mt-1">Yangi vazifa qo'shish orqali boshlang</p>
        </div>

    </div>

    <!-- Maxsus xabar oynasi (Toast) -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-msg">Muvaffaqiyatli bajarildi!</span>
    </div>

    <!-- JavaScript Kodlari -->
    <script>
        // Holat (State) o'zgaruvchilari
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let currentPriority = 'orta';
        let searchQuery = '';

        // DOM Elementlari
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const searchInput = document.getElementById('search-input');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const emptyText = document.getElementById('empty-text');
        const priorityButtons = document.querySelectorAll('.priority-btn');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const clearCompletedBtn = document.getElementById('clear-completed-btn');
        const taskProgressCount = document.getElementById('task-progress-count');
        const taskProgressText = document.getElementById('task-progress-text');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        // Prioritet tanlash logikasi
        priorityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                priorityButtons.forEach(b => {
                    b.classList.remove('ring-2', 'ring-amber-400', 'ring-emerald-400', 'ring-rose-400');
                });
                currentPriority = btn.getAttribute('data-priority');
                if(currentPriority === 'past') btn.classList.add('ring-2', 'ring-emerald-400');
                if(currentPriority === 'orta') btn.classList.add('ring-2', 'ring-amber-400');
                if(currentPriority === 'yuqori') btn.classList.add('ring-2', 'ring-rose-400');
            });
        });

        // Filtr tugmalarini boshqarish
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                    b.classList.add('text-slate-600');
                });
                btn.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                btn.classList.remove('text-slate-600');
                currentFilter = btn.getAttribute('data-filter');
                renderTasks();
            });
        });

        // Qidiruv paneli hodisasi
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTasks();
        });

        // Vazifa qo'shish
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: currentPriority
            };

            tasks.unshift(newTask);
            saveAndRender();
            taskInput.value = '';
            showToast("Vazifa muvaffaqiyatli qo'shildi!");
        });

        // Vazifani o'chirish
        window.deleteTask = function(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveAndRender();
            showToast("Vazifa o'chirildi!", "fa-circle-exclamation", "text-rose-400");
        }

        // Vazifa statusini o'zgartirish (Bajarilgan/Bajarilmagan)
        window.toggleTask = function(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveAndRender();
        }

        // Barcha vazifalarni tozalash ("Hammasi")
        clearAllBtn.addEventListener('click', () => {
            if (tasks.length === 0) {
                showToast("O'chirish uchun vazifalar mavjud emas!", "fa-triangle-exclamation", "text-amber-400");
                return;
            }
            if (confirm("Haqiqatan ham barcha vazifalarni o'chirmoqchimisiz?")) {
                tasks = [];
                saveAndRender();
                showToast("Barcha vazifalar tozalandi!", "fa-circle-exclamation", "text-rose-400");
            }
        });

        // Faqat bajarilganlarni tozalash ("Tugallanganlarni tozalash")
        clearCompletedBtn.addEventListener('click', () => {
            const completedCount = tasks.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast("Bajarilgan vazifalar topilmadi!", "fa-triangle-exclamation", "text-amber-400");
                return;
            }
            if (confirm(`Bajarilgan ${completedCount} ta vazifani o'chirmoqchimisiz?`)) {
                tasks = tasks.filter(task => !task.completed);
                saveAndRender();
                showToast("Bajarilgan vazifalar tozalandi!", "fa-circle-exclamation", "text-indigo-400");
            }
        });

        // LocalStorage ga saqlash va yangilash
        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
            updateStats();
        }

        // Statistikalarni yangilash
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            taskProgressCount.textContent = `${completed}/${total}`;
            taskProgressText.textContent = `${percentage}%`;
        }

        // Toast xabarini ko'rsatish
        function showToast(message, iconClass = "fa-circle-check", iconColor = "text-emerald-400") {
            toastMsg.textContent = message;
            const icon = document.getElementById('toast-icon');
            icon.className = `fa-solid ${iconClass} ${iconColor} text-lg`;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Vazifalarni ekranga chiqarish (Render)
        function renderTasks() {
            taskList.innerHTML = '';

            // 1. Filtrlash (Barchasi, Bajarilmagan, Bajarilgan)
            let result = tasks;
            if (currentFilter === 'active') {
                result = tasks.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                result = tasks.filter(t => t.completed);
            }

            // 2. Qidiruv bo'yicha saralash
            if (searchQuery !== '') {
                result = result.filter(t => t.text.toLowerCase().includes(searchQuery));
            }

            if (result.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                if(searchQuery !== '') {
                    emptyText.textContent = "Qidiruv bo'yicha hech narsa topilmadi";
                } else if(currentFilter === 'active') {
                    emptyText.textContent = "Bajarilmagan vazifalar yo'q";
                } else if(currentFilter === 'completed') {
                    emptyText.textContent = "Bajarilgan vazifalar yo'q";
                } else {
                    emptyText.textContent = "Hozircha vazifalar mavjud emas";
                }
            } else {
                emptyState.classList.remove('flex');
                emptyState.classList.add('hidden');
            }

            result.forEach(task => {
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-3.5 sm:p-4 rounded-2xl border transition-all duration-200 ${
                    task.completed 
                        ? 'bg-slate-50/70 border-slate-200 opacity-75' 
                        : 'bg-white border-slate-100 hover:border-indigo-200 shadow-sm hover:shadow-md'
                }`;

                // Prioritet ranglarini belgilash
                let priorityBadge = '';
                if(task.priority === 'past') {
                    priorityBadge = '<span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-600 border border-emerald-100">Past</span>';
                } else if(task.priority === 'orta') {
                    priorityBadge = '<span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-amber-50 text-amber-600 border border-amber-100">O\'rta</span>';
                } else if(task.priority === 'yuqori') {
                    priorityBadge = '<span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded-md bg-rose-50 text-rose-600 border border-rose-100">Yuqori</span>';
                }

                item.innerHTML = `
                    <div class="flex items-center gap-3.5 flex-1 min-w-0 mr-3">
                        <button onclick="toggleTask(${task.id})" class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all cursor-pointer flex-shrink-0 ${
                            task.completed 
                                ? 'bg-indigo-600 border-indigo-600 text-white' 
                                : 'border-slate-300 hover:border-indigo-500 bg-white'
                        }">
                            <i class="fa-solid fa-check text-xs ${task.completed ? 'block' : 'hidden'}"></i>
                        </button>
                        <div class="flex flex-col min-w-0">
                            <span class="text-sm sm:text-base font-medium truncate transition-all ${
                                task.completed ? 'line-through text-slate-400' : 'text-slate-700'
                            }">${escapeHtml(task.text)}</span>
                            <div class="mt-1 flex items-center gap-2">
                                ${priorityBadge}
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="w-9 h-9 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 flex items-center justify-center transition-all opacity-80 sm:opacity-0 group-hover:opacity-100 flex-shrink-0 cursor-pointer">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                `;
                taskList.appendChild(item);
            });
        }

        // Xavfsizlik uchun HTML belgilarini qochirish
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Ilk yuklanganda ishga tushirish
        renderTasks();
        updateStats();
    </script>
</body>
</html>
```
