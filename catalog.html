<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - iStore Premium iPhone Shop</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-blue-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-600/30">
                    <i class="fa-brands fa-apple text-xl"></i>
                </div>
                <span>iStore</span>
            </a>

            <nav class="hidden md:flex items-center gap-8 font-medium text-slate-600">
                <a href="index.html" class="hover:text-blue-600 transition nav-home">Bosh sahifa</a>
                <a href="catalog.html" class="text-blue-600 font-semibold nav-catalog">Katalog</a>
                <a href="contact.html" class="hover:text-blue-600 transition nav-contact">Aloqa</a>
            </nav>

            <div class="flex items-center gap-4">
                <select id="langSwitch" class="bg-slate-100 border border-slate-300 text-sm rounded-lg px-3.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium cursor-pointer">
                    <option value="uz" selected>O'zbekcha</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>

                <a href="cart.html" class="relative bg-slate-100 hover:bg-slate-200 p-3 rounded-full transition text-slate-700">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full font-bold hidden shadow-md">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Catalog Header -->
    <section class="py-12 bg-slate-900 text-white text-center">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-4xl font-black mb-3 catalog-title">iPhone Modellar Katalogi</h1>
            <p class="text-slate-400 catalog-subtitle">O'zingizga mos keladigan eng so'nggi rusumdagi iPhone smartfonini tanlang.</p>
        </div>
    </section>

    <!-- Products Grid Section -->
    <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="productsGrid">
            <!-- Dynamic products loaded via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2 text-xl font-bold text-slate-900">
                <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-sm">
                    <i class="fa-brands fa-apple"></i>
                </div>
                <span>iStore</span>
            </div>
            <p class="text-slate-500 text-sm footer-copy">&copy; 2026 iStore. Barcha huquqlar himoyalangan.</p>
            <div class="flex gap-6 text-slate-500 text-lg">
                <a href="#" class="hover:text-blue-600 transition"><i class="fa-brands fa-telegram"></i></a>
                <a href="#" class="hover:text-blue-600 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="hover:text-blue-600 transition"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>
    </footer>

    <!-- Catalog Logic & Multilanguage Script -->
    <script>
        const translations = {
            uz: {
                navHome: "Bosh sahifa",
                navCatalog: "Katalog",
                navContact: "Aloqa",
                catalogTitle: "iPhone Modellar Katalogi",
                catalogSubtitle: "O'zingizga mos keladigan eng so'nggi rusumdagi iPhone smartfonini tanlang.",
                buyBtn: "Sotib olish",
                cartAlert: "savatga qo'shildi!",
                footerCopy: "2026 iStore. Barcha huquqlar himoyalangan."
            },
            ru: {
                navHome: "Главная",
                navCatalog: "Каталог",
                navContact: "Контакты",
                catalogTitle: "Каталог моделей iPhone",
                catalogSubtitle: "Выберите подходящий вам iPhone новейшего поколения.",
                buyBtn: "Купить",
                cartAlert: "добавлен в корзину!",
                footerCopy: "2026 iStore. Все права защищены."
            },
            en: {
                navHome: "Home",
                navCatalog: "Catalog",
                navContact: "Contact",
                catalogTitle: "iPhone Models Catalog",
                catalogSubtitle: "Choose the latest iPhone model that suits you best.",
                buyBtn: "Buy Now",
                cartAlert: "added to cart!",
                footerCopy: "2026 iStore. All rights reserved."
            }
        };

        const products = [
            {
                id: 1,
                name: "iPhone 17 Pro Max",
                storage: "256GB / Natural Titanium",
                price: 1399,
                image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 2,
                name: "iPhone 17 Pro",
                storage: "128GB / Desert Titanium",
                price: 1199,
                image: "https://images.unsplash.com/photo-1695048065451-d299478d4ab5?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 3,
                name: "iPhone 16 Pro Max",
                storage: "256GB / Black Titanium",
                price: 1099,
                image: "https://images.unsplash.com/photo-1695048132840-7c1525e98585?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 4,
                name: "iPhone 16",
                storage: "128GB / Ultramarine",
                price: 899,
                image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 5,
                name: "iPhone 15 Pro",
                storage: "128GB / White Titanium",
                price: 999,
                image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 6,
                name: "iPhone 15",
                storage: "128GB / Pink",
                price: 799,
                image: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 7,
                name: "iPhone 14",
                storage: "128GB / Starlight",
                price: 699,
                image: "https://images.unsplash.com/photo-1591337676887-a217a6970a8a?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 8,
                name: "iPhone 13",
                storage: "128GB / Midnight",
                price: 599,
                image: "https://images.unsplash.com/photo-1573148195971-8e3105e4a8ea?q=80&w=600&auto=format&fit=crop"
            }
        ];

        const langSwitch = document.getElementById('langSwitch');

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const lang = localStorage.getItem('site_lang') || 'uz';
            const t = translations[lang];

            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col">
                        <div class="h-64 bg-slate-100 rounded-xl mb-4 flex items-center justify-center relative overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover hover:scale-110 transition duration-500">
                        </div>
                        <h3 class="font-bold text-slate-900 text-lg mb-1">${p.name}</h3>
                        <p class="text-slate-500 text-xs mb-3">${p.storage}</p>
                        <div class="flex items-center justify-between mt-auto pt-2 border-t border-slate-100">
                            <span class="text-blue-600 font-black text-xl">$${p.price}</span>
                            <button onclick="addToCart(${p.id})" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-xl transition text-sm shadow-md shadow-blue-600/20">
                                ${t.buyBtn}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function changeLanguage(lang) {
            localStorage.setItem('site_lang', lang);
            const t = translations[lang];

            document.querySelector('.nav-home').textContent = t.navHome;
            document.querySelector('.nav-catalog').textContent = t.navCatalog;
            document.querySelector('.nav-contact').textContent = t.navContact;
            document.querySelector('.catalog-title').textContent = t.catalogTitle;
            document.querySelector('.catalog-subtitle').textContent = t.catalogSubtitle;
            document.querySelector('.footer-copy').textContent = t.footerCopy;

            renderProducts();
        }

        langSwitch.addEventListener('change', (e) => {
            changeLanguage(e.target.value);
        });

        function addToCart(id) {
            let cart = JSON.parse(localStorage.getItem('istore_cart')) || [];
            let product = products.find(p => p.id === id);
            let existing = cart.find(item => item.id === id);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            localStorage.setItem('istore_cart', JSON.stringify(cart));
            updateCartBadge();

            const lang = localStorage.getItem('site_lang') || 'uz';
            alert(`${product.name} ${translations[lang].cartAlert}`);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('istore_cart')) || [];
            let badge = document.getElementById('cartBadge');
            if(cart.length > 0) {
                badge.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Initialize
        const savedLang = localStorage.getItem('site_lang') || 'uz';
        langSwitch.value = savedLang;
        renderProducts();
        updateCartBadge();
    </script>
</body>
</html>
