<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulot Tafsilotlari - iStore Premium iPhone Shop</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-blue-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-600/30">
                    <i class="fa-brands fa-apple text-xl"></i>
                </div>
                <span>iStore</span>
            </a>

            <nav class="hidden md:flex items-center gap-8 font-medium text-slate-600">
                <a href="index.html" class="hover:text-blue-600 transition nav-home">Bosh sahifa</a>
                <a href="catalog.html" class="hover:text-blue-600 transition nav-catalog">Katalog</a>
                <a href="contact.html" class="hover:text-blue-600 transition nav-contact">Aloqa</a>
            </nav>

            <div class="flex items-center gap-4">
                <select id="langSwitch" class="bg-slate-100 border border-slate-300 text-sm rounded-lg px-3.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium cursor-pointer">
                    <option value="uz" selected>O'zbekcha</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>

                <a href="cart.html" class="relative bg-slate-100 hover:bg-slate-200 p-3 rounded-full transition text-slate-700">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full font-bold hidden shadow-md">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Product Detail Section -->
    <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center bg-white p-8 sm:p-12 rounded-3xl border border-slate-200 shadow-sm">
            <!-- Product Image -->
            <div class="h-96 bg-slate-50 rounded-2xl flex items-center justify-center p-4 overflow-hidden relative">
                <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=600&auto=format&fit=crop" alt="iPhone 17 Pro Max" class="w-full h-full object-cover rounded-xl shadow-lg">
                <span class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow">FLAGSHIP</span>
            </div>

            <!-- Product Info -->
            <div class="space-y-6">
                <span class="bg-blue-50 text-blue-600 font-bold uppercase tracking-wider text-xs px-3 py-1.5 rounded-full product-badge">Rasmiy Kafolatli</span>
                <h1 class="text-3xl sm:text-4xl font-black text-slate-900 product-title">iPhone 17 Pro Max</h1>
                <p class="text-slate-500 text-sm product-desc leading-relaxed">Eng so'nggi A19 Pro chipi, titan korpus, professional uch kamerali tizim va kun bo'yi ishlaydigan batareya quvvati.</p>
                
                <div class="space-y-3">
                    <label class="block font-bold text-sm text-slate-700 storage-label">Xotirani tanlang:</label>
                    <div class="flex gap-4">
                        <button class="flex-1 py-3 px-4 rounded-xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm transition">128GB</button>
                        <button class="flex-1 py-3 px-4 rounded-xl border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-bold text-sm transition">256GB</button>
                        <button class="flex-1 py-3 px-4 rounded-xl border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-bold text-sm transition">512GB</button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <div>
                        <span class="text-xs text-slate-400 block price-label">Narxi:</span>
                        <span class="text-3xl font-black text-blue-600">\$1,399</span>
                    </div>
                    <button onclick="addCurrentToCart()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-4 rounded-xl transition shadow-lg shadow-blue-600/30 buy-btn">
                        Savatga qo'shish
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2 text-xl font-bold text-slate-900">
                <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-sm">
                    <i class="fa-brands fa-apple"></i>
                </div>
                <span>iStore</span>
            </div>
            <p class="text-slate-500 text-sm footer-copy">&copy; 2026 iStore. Barcha huquqlar himoyalangan.</p>
            <div class="flex gap-6 text-slate-500 text-lg">
                <a href="#" class="hover:text-blue-600 transition"><i class="fa-brands fa-telegram"></i></a>
                <a href="#" class="hover:text-blue-600 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="hover:text-blue-600 transition"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>
    </footer>

    <!-- Script & Multilanguage -->
    <script>
        const translations = {
            uz: {
                navHome: "Bosh sahifa",
                navCatalog: "Katalog",
                navContact: "Aloqa",
                productBadge: "Rasmiy Kafolatli",
                productDesc: "Eng so'nggi A19 Pro chipi, titan korpus, professional uch kamerali tizim va kun bo'yi ishlaydigan batareya quvvati.",
                storageLabel: "Xotirani tanlang:",
                priceLabel: "Narxi:",
                buyBtn: "Savatga qo'shish",
                cartAlert: "savatga qo'shildi!",
                footerCopy: "2026 iStore. Barcha huquqlar himoyalangan."
            },
            ru: {
                navHome: "Главная",
                navCatalog: "Каталог",
                navContact: "Контакты",
                productBadge: "Официальная гарантия",
                productDesc: "Новейший чип A19 Pro, титановый корпус, профессиональная система трех камер и мощный аккумулятор.",
                storageLabel: "Выберите память:",
                priceLabel: "Цена:",
                buyBtn: "Добавить в корзину",
                cartAlert: "добавлен в корзину!",
                footerCopy: "2026 iStore. Все права защищены."
            },
            en: {
                navHome: "Home",
                navCatalog: "Catalog",
                navContact: "Contact",
                productBadge: "Official Warranty",
                productDesc: "The latest A19 Pro chip, titanium design, professional triple-camera system, and all-day battery life.",
                storageLabel: "Select Storage:",
                priceLabel: "Price:",
                buyBtn: "Add to Cart",
                cartAlert: "added to cart!",
                footerCopy: "2026 iStore. All rights reserved."
            }
        };

        const langSwitch = document.getElementById('langSwitch');

        function changeLanguage(lang) {
            localStorage.setItem('site_lang', lang);
            const t = translations[lang];

            document.querySelector('.nav-home').textContent = t.navHome;
            document.querySelector('.nav-catalog').textContent = t.navCatalog;
            document.querySelector('.nav-contact').textContent = t.navContact;
            document.querySelector('.product-badge').textContent = t.productBadge;
            document.querySelector('.product-desc').textContent = t.productDesc;
            document.querySelector('.storage-label').textContent = t.storageLabel;
            document.querySelector('.price-label').textContent = t.priceLabel;
            document.querySelector('.buy-btn').textContent = t.buyBtn;
            document.querySelector('.footer-copy').textContent = t.footerCopy;
        }

        langSwitch.addEventListener('change', (e) => {
            changeLanguage(e.target.value);
        });

        function addCurrentToCart() {
            let cart = JSON.parse(localStorage.getItem('istore_cart')) || [];
            let product = {
                id: 1,
                name: "iPhone 17 Pro Max",
                storage: "256GB / Natural Titanium",
                price: 1399,
                image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=600&auto=format&fit=crop",
                qty: 1
            };

            let existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push(product);
            }

            localStorage.setItem('istore_cart', JSON.stringify(cart));
            updateCartBadge();

            const lang = localStorage.getItem('site_lang') || 'uz';
            alert(`${product.name} ${translations[lang].cartAlert}`);
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('istore_cart')) || [];
            let badge = document.getElementById('cartBadge');
            if(cart.length > 0) {
                badge.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        const savedLang = localStorage.getItem('site_lang') || 'uz';
        langSwitch.value = savedLang;
        changeLanguage(savedLang);
        updateCartBadge();
    </script>
</body>
</html>
